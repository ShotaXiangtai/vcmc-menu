# /menu で開くメニューの定義です。文字はすべて MiniMessage 形式です。
# /menu reload で読み直せます（再起動は不要です）。
# ここの文面は日本語です。ほかの言語の文面は lang フォルダのファイルの menu にあります。
# 文面を変えたり、ボタンを追加したりしたら、lang のファイルの同じ場所も変更してください。翻訳が無い文面はここの日本語で表示します。
#
# screens:
#   <画面の ID>:              main が最初に開く画面です
#     title: 画面のタイトル
#     rows: 行数（1〜6、既定は 3）
#     filler: 空きスロットを埋めるアイテム（既定は GRAY_STAINED_GLASS_PANE）
#     buttons:
#       <ボタンの ID>:
#         slot: 位置（左上が 0、1 行は 9 スロット）
#         icon: アイテムの名前
#         name: ボタンの名前
#         lore: 説明の行のリスト
#         次のどれか 1 つを指定します:
#         open: 開く画面の ID
#         close: true（メニューを閉じる）
#         command: 実行するコマンド（先頭の / は不要）
#         via: server または client（command のとき。既定は server）
#              server: このサーバーでプレイヤーとして実行します
#              client: Velocity など、このサーバーの外にあるコマンドに使います。
#                      確認ダイアログのボタンを押すと、プレイヤーのクライアントから送られます
#         inputs: command の {キー} に入れる値を、書いた順にプレイヤーへ尋ねます
#           <キー>:
#             type: player（一覧から選ぶ。名前の入力もできる）または text（文字入力）
#             label: 入力欄の説明
#             max-length: 最大文字数（1〜128。既定は player が 16、text が 32）

screens:
  main:
    title: "<dark_gray>メニュー"
    rows: 5
    buttons:
      hub:
        slot: 10
        icon: ENDER_PEARL
        name: "<aqua>ハブへ移動"
        lore:
          - "<gray>ハブ（ロビー）へ移動します"
          - "<dark_gray>/hub"
        command: "hub"
        # /hub は Velocity の vcmc-hubcommand のコマンドです。サーバー側から実行しても届きません。
        via: client
      sit:
        slot: 11
        icon: OAK_STAIRS
        name: "<green>座る"
        lore:
          - "<gray>その場に座ります"
          - "<dark_gray>/sit"
        command: "sit"
      lay:
        slot: 12
        icon: RED_BED
        name: "<green>横になる"
        lore:
          - "<gray>その場で横になります"
          - "<dark_gray>/lay"
        command: "lay"
      crawl:
        slot: 13
        icon: RABBIT_FOOT
        name: "<green>這う"
        lore:
          - "<gray>地面を這って進みます"
          - "<dark_gray>/crawl"
        command: "crawl"
      spin:
        slot: 14
        icon: NAUTILUS_SHELL
        name: "<green>くるくる回る"
        lore:
          - "<gray>その場で回転します"
          - "<dark_gray>/spin"
        command: "spin"
      inspect:
        slot: 15
        icon: SPYGLASS
        name: "<gold>ブロックの変更履歴を調べる"
        lore:
          - "<gray>調査モードの ON / OFF を切り替えます"
          - "<gray>ON の間にブロックをクリックすると、"
          - "<gray>変更履歴が表示されます"
          - "<dark_gray>/co i"
        command: "co i"
      gchest:
        slot: 16
        icon: ENDER_CHEST
        name: "<light_purple>共有チェスト"
        lore:
          - "<gray>自分専用の共有チェストを開きます"
          - "<gray>どのサーバーから開いても中身は同じです"
          - "<dark_gray>/gchest"
        command: "gchest"
      enderchest:
        slot: 22
        icon: ENDER_CHEST
        name: "<dark_purple>エンダーチェスト"
        lore:
          - "<gray>どこからでもエンダーチェストを開けます"
          - "<gray>中身は設置したエンダーチェストと同じです"
          - "<dark_gray>/enderchest"
        # /enderchest は vcmc-enderchest のコマンドです
        command: "enderchest"
      resource:
        slot: 28
        icon: IRON_PICKAXE
        name: "<yellow>資源ワールド"
        lore:
          - "<gray>資源ワールドへの移動と、"
          - "<gray>元の場所へ戻る操作ができます"
        open: resource
      protection:
        slot: 30
        icon: CHEST
        name: "<yellow>チェスト保護"
        lore:
          - "<gray>チェストなどのブロックを保護して、"
          - "<gray>使える人を設定できます"
        open: protection
      vote:
        slot: 32
        icon: PAPER
        name: "<yellow>投票"
        lore:
          - "<gray>投票サイトや投票ショップを開けます"
        open: vote
      media:
        slot: 34
        icon: ENDER_EYE
        name: "<yellow>配信・撮影"
        lore:
          - "<gray>配信中や撮影中の表示を切り替えられます"
        open: media
      close:
        slot: 40
        icon: BARRIER
        name: "<red>閉じる"
        close: true

  resource:
    title: "<dark_gray>資源ワールド"
    rows: 3
    buttons:
      main-world:
        slot: 10
        icon: COMPASS
        name: "<aqua>メインワールドへ戻る"
        lore:
          - "<gray>資源ワールドに入る前にいた場所へ戻ります"
          - "<gray>資源ワールドにいるときだけ使えます"
          - "<dark_gray>/main"
        command: "main"
      overworld:
        slot: 12
        icon: GRASS_BLOCK
        name: "<green>資源オーバーワールド"
        lore:
          - "<gray>スポーン地点へ移動します"
          - "<dark_gray>/resource overworld"
        command: "resource overworld"
      nether:
        slot: 14
        icon: NETHERRACK
        name: "<red>資源ネザー"
        lore:
          - "<gray>スポーン地点へ移動します"
          - "<dark_gray>/resource nether"
        command: "resource nether"
      end:
        slot: 16
        icon: END_STONE
        name: "<light_purple>資源エンド"
        lore:
          - "<gray>スポーン地点へ移動します"
          - "<dark_gray>/resource end"
        command: "resource end"
      back:
        slot: 22
        icon: ARROW
        name: "<yellow>戻る"
        open: main

  # ここからチェスト保護です。Bolt の Wiki（https://github.com/pop4959/Bolt/wiki#commands）と
  # 既定の config.yml に合わせています。種類とモードの名前は Bolt の日本語表示と同じです。
  protection:
    title: "<dark_gray>チェスト保護"
    rows: 5
    buttons:
      private:
        slot: 10
        icon: IRON_DOOR
        name: "<green>私有で保護"
        lore:
          - "<gray>自分だけが使えるようにします"
          - "<yellow>このあと対象のブロックをクリックしてください"
          - "<dark_gray>/bolt lock private"
        command: "bolt lock private"
      display:
        slot: 11
        icon: GLASS
        name: "<green>展示で保護"
        lore:
          - "<gray>誰でも中を見られますが、"
          - "<gray>出し入れはできません"
          - "<yellow>このあと対象のブロックをクリックしてください"
          - "<dark_gray>/bolt lock display"
        command: "bolt lock display"
      deposit:
        slot: 12
        icon: HOPPER
        name: "<green>収納で保護"
        lore:
          - "<gray>誰でもアイテムを入れられますが、"
          - "<gray>取り出せるのは自分だけです"
          - "<yellow>このあと対象のブロックをクリックしてください"
          - "<dark_gray>/bolt lock deposit"
        command: "bolt lock deposit"
      withdrawal:
        slot: 13
        icon: DROPPER
        name: "<green>取り出しで保護"
        lore:
          - "<gray>誰でもアイテムを取り出せますが、"
          - "<gray>入れることはできません"
          - "<yellow>このあと対象のブロックをクリックしてください"
          - "<dark_gray>/bolt lock withdrawal"
        command: "bolt lock withdrawal"
      public:
        slot: 14
        icon: OAK_DOOR
        name: "<green>公共で保護"
        lore:
          - "<gray>誰でも使えますが、"
          - "<gray>壊せるのは自分だけです"
          - "<yellow>このあと対象のブロックをクリックしてください"
          - "<dark_gray>/bolt lock public"
        command: "bolt lock public"
      unlock:
        slot: 15
        icon: TRIPWIRE_HOOK
        name: "<red>保護を解除"
        lore:
          - "<gray>ブロックの保護を解除します"
          - "<yellow>このあと対象のブロックをクリックしてください"
          - "<dark_gray>/bolt unlock"
        command: "bolt unlock"
      info:
        slot: 16
        icon: BOOK
        name: "<aqua>保護の情報を見る"
        lore:
          - "<gray>所有者や、使える人の一覧を表示します"
          - "<yellow>このあと対象のブロックをクリックしてください"
          - "<dark_gray>/bolt info"
        command: "bolt info"
      access:
        slot: 29
        icon: PLAYER_HEAD
        name: "<yellow>使える人"
        lore:
          - "<gray>保護したブロックを使える人を設定します"
        open: protection-access
      trust:
        slot: 30
        icon: EMERALD
        name: "<yellow>信頼する人"
        lore:
          - "<gray>自分の保護をすべて使える人を設定します"
        open: protection-trust
      group:
        slot: 31
        icon: BOOKSHELF
        name: "<yellow>グループ"
        lore:
          - "<gray>プレイヤーのグループを管理します"
        open: protection-group
      transfer:
        slot: 32
        icon: NAME_TAG
        name: "<yellow>所有権の譲渡"
        lore:
          - "<gray>保護の所有権を別のプレイヤーに譲ります"
        open: protection-transfer
      other:
        slot: 33
        icon: COMPARATOR
        name: "<yellow>モード・その他"
        lore:
          - "<gray>モードの切り替えやパスワードの入力、"
          - "<gray>ヘルプの表示ができます"
        open: protection-other
      back:
        slot: 40
        icon: ARROW
        name: "<yellow>戻る"
        open: main

  protection-access:
    title: "<dark_gray>チェスト保護: 使える人"
    rows: 4
    buttons:
      player-add:
        slot: 11
        icon: PLAYER_HEAD
        name: "<green>プレイヤーを追加"
        lore:
          - "<gray>指定したプレイヤーが使えるようにします"
          - "<yellow>このあと対象のブロックをクリックしてください"
          - "<dark_gray>/bolt edit add <名前>"
        command: "bolt edit add {player}"
        inputs:
          player:
            type: player
            label: "追加するプレイヤー"
      group-add:
        slot: 13
        icon: BOOKSHELF
        name: "<green>グループを追加"
        lore:
          - "<gray>グループのメンバー全員が使えるようにします"
          - "<yellow>このあと対象のブロックをクリックしてください"
          - "<dark_gray>/bolt modify add normal group <グループ名>"
        command: "bolt modify add normal group {group}"
        inputs:
          group:
            type: text
            label: "追加するグループの名前"
      password-add:
        slot: 15
        icon: TRIPWIRE_HOOK
        name: "<green>パスワードを設定"
        lore:
          - "<gray>パスワードを知っている人が使えるようにします"
          - "<yellow>このあと対象のブロックをクリックしてください"
          - "<dark_gray>/bolt modify add normal password <パスワード>"
        command: "bolt modify add normal password {password}"
        inputs:
          password:
            type: text
            label: "設定するパスワード"
      player-remove:
        slot: 20
        icon: SKELETON_SKULL
        name: "<red>プレイヤーを外す"
        lore:
          - "<gray>指定したプレイヤーを使える人から外します"
          - "<yellow>このあと対象のブロックをクリックしてください"
          - "<dark_gray>/bolt edit remove <名前>"
        command: "bolt edit remove {player}"
        inputs:
          player:
            type: player
            label: "外すプレイヤー"
      group-remove:
        slot: 22
        icon: CHISELED_BOOKSHELF
        name: "<red>グループを外す"
        lore:
          - "<gray>指定したグループを使える人から外します"
          - "<yellow>このあと対象のブロックをクリックしてください"
          - "<dark_gray>/bolt modify remove normal group <グループ名>"
        command: "bolt modify remove normal group {group}"
        inputs:
          group:
            type: text
            label: "外すグループの名前"
      password-remove:
        slot: 24
        icon: STRING
        name: "<red>パスワードを解除"
        lore:
          - "<gray>設定したパスワードを解除します"
          - "<yellow>このあと対象のブロックをクリックしてください"
          - "<dark_gray>/bolt modify remove normal password <パスワード>"
        command: "bolt modify remove normal password {password}"
        inputs:
          password:
            type: text
            label: "解除するパスワード"
      back:
        slot: 31
        icon: ARROW
        name: "<yellow>戻る"
        open: protection

  protection-trust:
    title: "<dark_gray>チェスト保護: 信頼する人"
    rows: 3
    buttons:
      add:
        slot: 11
        icon: LIME_DYE
        name: "<green>信頼する人を追加"
        lore:
          - "<gray>自分の保護をすべて使えるようにします"
          - "<dark_gray>/bolt trust add player <名前>"
        command: "bolt trust add player {player}"
        inputs:
          player:
            type: player
            label: "信頼するプレイヤー"
      remove:
        slot: 13
        icon: RED_DYE
        name: "<red>信頼する人を外す"
        lore:
          - "<gray>信頼する人から外します"
          - "<dark_gray>/bolt trust remove player <名前>"
        command: "bolt trust remove player {player}"
        inputs:
          player:
            type: player
            label: "外すプレイヤー"
      list:
        slot: 15
        icon: BOOK
        name: "<aqua>信頼する人の一覧"
        lore:
          - "<gray>信頼する人の一覧を表示します"
          - "<dark_gray>/bolt trust"
        command: "bolt trust"
      back:
        slot: 22
        icon: ARROW
        name: "<yellow>戻る"
        open: protection

  protection-group:
    title: "<dark_gray>チェスト保護: グループ"
    rows: 3
    buttons:
      create:
        slot: 11
        icon: WRITABLE_BOOK
        name: "<green>グループを作成"
        lore:
          - "<gray>新しいグループを作成します"
          - "<gray>ブロックに追加するときは「使える人」から行います"
          - "<dark_gray>/bolt group create <グループ名>"
        command: "bolt group create {group}"
        inputs:
          group:
            type: text
            label: "作成するグループの名前"
      add:
        slot: 12
        icon: LIME_DYE
        name: "<green>メンバーを追加"
        lore:
          - "<gray>グループにメンバーを追加します"
          - "<dark_gray>/bolt group add <グループ名> <名前>"
        command: "bolt group add {group} {player}"
        inputs:
          group:
            type: text
            label: "メンバーを追加するグループの名前"
          player:
            type: player
            label: "追加するプレイヤー"
      remove:
        slot: 13
        icon: RED_DYE
        name: "<red>メンバーを外す"
        lore:
          - "<gray>グループからメンバーを外します"
          - "<dark_gray>/bolt group remove <グループ名> <名前>"
        command: "bolt group remove {group} {player}"
        inputs:
          group:
            type: text
            label: "メンバーを外すグループの名前"
          player:
            type: player
            label: "外すプレイヤー"
      list:
        slot: 14
        icon: BOOK
        name: "<aqua>メンバーの一覧"
        lore:
          - "<gray>グループのメンバーを表示します"
          - "<dark_gray>/bolt group list <グループ名>"
        command: "bolt group list {group}"
        inputs:
          group:
            type: text
            label: "表示するグループの名前"
      delete:
        slot: 15
        icon: LAVA_BUCKET
        name: "<red>グループを削除"
        lore:
          - "<gray>グループを削除します"
          - "<dark_gray>/bolt group delete <グループ名>"
        command: "bolt group delete {group}"
        inputs:
          group:
            type: text
            label: "削除するグループの名前"
      back:
        slot: 22
        icon: ARROW
        name: "<yellow>戻る"
        open: protection

  protection-transfer:
    title: "<dark_gray>チェスト保護: 所有権の譲渡"
    rows: 3
    buttons:
      transfer:
        slot: 11
        icon: NAME_TAG
        name: "<gold>所有権を譲渡"
        lore:
          - "<gray>保護の所有権を別のプレイヤーに譲ります"
          - "<gray>相手が承認すると譲渡されます"
          - "<yellow>このあと対象のブロックをクリックしてください"
          - "<dark_gray>/bolt transfer <名前>"
        command: "bolt transfer {player}"
        inputs:
          player:
            type: player
            label: "譲渡する相手"
      list:
        slot: 12
        icon: BOOK
        name: "<aqua>譲渡リクエストの一覧"
        lore:
          - "<gray>届いたリクエストと、"
          - "<gray>自分が出したリクエストを表示します"
          - "<dark_gray>/bolt requests list"
        command: "bolt requests list"
      accept:
        slot: 13
        icon: LIME_DYE
        name: "<green>譲渡を承認"
        lore:
          - "<gray>相手からの譲渡をまとめて受け取ります"
          - "<dark_gray>/bolt requests accept <名前>"
        command: "bolt requests accept {player}"
        inputs:
          player:
            type: player
            label: "譲渡を承認する相手"
      deny:
        slot: 14
        icon: RED_DYE
        name: "<red>譲渡を拒否"
        lore:
          - "<gray>相手からの譲渡をまとめて断ります"
          - "<dark_gray>/bolt requests deny <名前>"
        command: "bolt requests deny {player}"
        inputs:
          player:
            type: player
            label: "譲渡を拒否する相手"
      cancel:
        slot: 15
        icon: BARRIER
        name: "<red>譲渡を取り消す"
        lore:
          - "<gray>相手に出した譲渡をまとめて取り消します"
          - "<dark_gray>/bolt requests cancel <名前>"
        command: "bolt requests cancel {player}"
        inputs:
          player:
            type: player
            label: "譲渡を取り消す相手"
      back:
        slot: 22
        icon: ARROW
        name: "<yellow>戻る"
        open: protection

  protection-other:
    title: "<dark_gray>チェスト保護: モード・その他"
    rows: 3
    buttons:
      persist:
        slot: 10
        icon: REPEATER
        name: "<green>連続モード"
        lore:
          - "<gray>保護などの操作を、OFF にするまで続けて行えます"
          - "<gray>押すたびに ON / OFF が切り替わります"
          - "<dark_gray>/bolt mode persist"
        command: "bolt mode persist"
      nolock:
        slot: 11
        icon: IRON_BARS
        name: "<green>手動保護モード"
        lore:
          - "<gray>ブロックを置いても自動で保護されなくなります"
          - "<gray>押すたびに ON / OFF が切り替わります"
          - "<dark_gray>/bolt mode nolock"
        # サイトの表記は「no lock」ですが、Bolt が受け付けるのは nolock です。
        command: "bolt mode nolock"
      nospam:
        slot: 12
        icon: FEATHER
        name: "<green>通知非表示モード"
        lore:
          - "<gray>操作時に出るメッセージを非表示にします"
          - "<gray>押すたびに ON / OFF が切り替わります"
          - "<dark_gray>/bolt mode nospam"
        # サイトの表記は「no spam」ですが、Bolt が受け付けるのは nospam です。
        command: "bolt mode nospam"
      password:
        slot: 14
        icon: GOLD_NUGGET
        name: "<gold>パスワードを入力"
        lore:
          - "<gray>パスワードが設定されたブロックを使えるようにします"
          - "<dark_gray>/bolt password <パスワード>"
        command: "bolt password {password}"
        inputs:
          password:
            type: text
            label: "パスワード"
      help:
        slot: 15
        icon: KNOWLEDGE_BOOK
        name: "<aqua>ヘルプ"
        lore:
          - "<gray>Bolt のコマンドの一覧を表示します"
          - "<dark_gray>/bolt help"
        command: "bolt help"
      help-command:
        slot: 16
        icon: BOOK
        name: "<aqua>コマンドごとのヘルプ"
        lore:
          - "<gray>指定したコマンドの説明を表示します"
          - "<dark_gray>/bolt help <コマンド名>"
        command: "bolt help {command}"
        inputs:
          command:
            type: text
            label: "コマンド名（lock、edit、group など）"
      back:
        slot: 22
        icon: ARROW
        name: "<yellow>戻る"
        open: protection

  vote:
    title: "<dark_gray>投票"
    rows: 5
    buttons:
      sites:
        slot: 10
        icon: PAPER
        name: "<green>投票サイトの一覧"
        lore:
          - "<gray>投票サイトの一覧を表示します"
          - "<dark_gray>/vote"
        command: "vote"
      gui:
        slot: 12
        icon: CHEST_MINECART
        name: "<green>投票メニュー"
        lore:
          - "<gray>投票メニューを開きます"
          - "<dark_gray>/votegui"
        command: "votegui"
      shop:
        slot: 14
        icon: EMERALD
        name: "<green>投票ショップ"
        lore:
          - "<gray>投票ポイントをアイテムと交換します"
          - "<dark_gray>/vote shop"
        command: "vote shop"
      help:
        slot: 16
        icon: KNOWLEDGE_BOOK
        name: "<aqua>投票のヘルプ"
        lore:
          - "<gray>投票コマンドのヘルプを表示します"
          - "<dark_gray>/vote help"
        command: "vote help"
      total:
        slot: 28
        icon: GOLD_INGOT
        name: "<yellow>合計投票数"
        lore:
          - "<gray>自分の合計投票数を表示します"
          - "<dark_gray>/vote total"
